name: Update lot sizes

# Reads the official lot sizes (Dhan instrument master + NSE) every weekday morning and keeps lots.json up to date.
# ScaleIn reads lots.json from your site, so lot sizes become automatic. You can also run it by hand: Actions tab -> Update lot sizes -> Run workflow.
on:
  schedule:
    - cron: '45 3 * * 1-5'      # 09:15 IST, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the official lot sizes
        run: |
          cat > /tmp/update_lots.py <<'PYEOF'
          # ScaleIn — keeps lots.json in sync with the official lot sizes.
          # Sources: Dhan instrument master (all six indices, incl. Sensex/Bankex) and NSE's fo_mktlots.csv (NSE indices; NSE wins on a conflict).
          # Never writes obviously-bad data: values must be whole numbers 1-5000 and within 0.25x-4x of the previous value.
          import csv, io, json, os, re, sys, datetime, collections, urllib.request

          TODAY = datetime.date.today()
          KEYS = {'nifty':'NIFTY','banknifty':'BANKNIFTY','finnifty':'FINNIFTY','midcap':'MIDCPNIFTY','sensex':'SENSEX','bankex':'BANKEX'}
          NSE_KEYS = ['nifty','banknifty','finnifty','midcap']
          DHAN_URL = 'https://images.dhan.co/api-data/api-scrip-master.csv'
          NSE_URL  = 'https://nsearchives.nseindia.com/content/fo/fo_mktlots.csv'
          OUT = os.environ.get('LOTS_OUT','lots.json')

          def get(url, test_env):
              p = os.environ.get(test_env)
              if p: return open(p, encoding='utf-8', errors='replace').read()
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; scalein-lots)','Accept':'*/*'})
              with urllib.request.urlopen(req, timeout=90) as r: return r.read().decode('utf-8','replace')

          def parse_date(s):
              s = str(s).strip()
              for f in ('%Y-%m-%d %H:%M:%S','%Y-%m-%d','%d-%m-%Y','%d/%m/%Y','%d-%b-%Y','%d %b %Y','%Y/%m/%d'):
                  try: return datetime.datetime.strptime(s, f).date()
                  except ValueError: pass
              return None

          def from_dhan(text):
              rd = csv.reader(io.StringIO(text)); hdr = [h.strip().upper() for h in next(rd)]
              def col(*names):
                  for n in names:
                      if n in hdr: return hdr.index(n)
                  return None
              ci = col('SEM_INSTRUMENT_NAME','INSTRUMENT'); cs = col('SEM_TRADING_SYMBOL','TRADING_SYMBOL','SYMBOL_NAME','SM_SYMBOL_NAME')
              cl = col('SEM_LOT_UNITS','LOT_SIZE','LOT_UNITS'); ce = col('SEM_EXPIRY_DATE','EXPIRY_DATE')
              if None in (ci, cs, cl): raise ValueError('unexpected Dhan columns: ' + ','.join(hdr[:14]))
              need = max(x for x in (ci, cs, cl, ce) if x is not None)
              found = {k: collections.defaultdict(collections.Counter) for k in KEYS}
              for row in rd:
                  if len(row) <= need or row[ci].strip().upper() not in ('FUTIDX','OPTIDX'): continue
                  under = re.split(r'[-\s]', row[cs].strip().upper())[0]
                  for k, sym in KEYS.items():
                      if under != sym: continue
                      try: lot = int(float(row[cl]))
                      except ValueError: continue
                      found[k][parse_date(row[ce]) if ce is not None else None][lot] += 1
              out = {}
              for k, byexp in found.items():
                  dated = [(e, c) for e, c in byexp.items() if e and e >= TODAY]
                  if dated: c = min(dated, key=lambda x: x[0])[1]                    # the nearest live expiry
                  else:
                      c = collections.Counter()
                      for cc in byexp.values(): c.update(cc)
                  if c: out[k] = c.most_common(1)[0][0]
              return out

          def from_nse(text):
              rows = list(csv.reader(io.StringIO(text))); h = None
              for i, r in enumerate(rows):
                  if any(c.strip().upper() == 'SYMBOL' for c in r): h = i; break
              if h is None: raise ValueError('no SYMBOL header in NSE file')
              cs = [c.strip().upper() for c in rows[h]].index('SYMBOL'); out = {}
              for r in rows[h+1:]:
                  if len(r) <= cs: continue
                  sym = r[cs].strip().upper()
                  for k in NSE_KEYS:
                      if KEYS[k] == sym:
                          for c in r[cs+1:]:                                          # first month column that has a number = current series
                              c = c.strip()
                              if re.fullmatch(r'\d+', c): out[k] = int(c); break
              return out

          def main():
              prev = {}
              if os.path.exists(OUT):
                  try: prev = json.load(open(OUT, encoding='utf-8'))
                  except Exception: prev = {}
              plots = dict(prev.get('lots', {}))
              dhan, nse, used = {}, {}, []
              try: dhan = from_dhan(get(DHAN_URL, 'LOTS_TEST_DHAN')); used.append('dhan')
              except Exception as e: print('WARN Dhan source failed:', e)
              try: nse = from_nse(get(NSE_URL, 'LOTS_TEST_NSE')); used.append('nse')
              except Exception as e: print('WARN NSE source failed:', e)
              print('Dhan says:', dhan); print('NSE says :', nse)
              new = {}
              for k in KEYS:
                  v = nse.get(k) if (k in NSE_KEYS and k in nse) else dhan.get(k)
                  if k in nse and k in dhan and nse[k] != dhan[k]: print('NOTE conflict for', k, '— Dhan', dhan[k], 'vs NSE', nse[k], '(NSE used)')
                  if v is None: continue
                  if not (1 <= v <= 5000): print('SKIP', k, v, 'out of range'); continue
                  if k in plots and not (0.25 <= v / plots[k] <= 4): print('SKIP', k, v, 'looks wrong vs previous', plots[k]); continue
                  new[k] = v
              if 'nifty' not in new or 'banknifty' not in new:
                  print('ERROR: could not read Nifty and Bank Nifty from any source — lots.json left untouched'); sys.exit(2)
              final = {**plots, **new}; changed = any(plots.get(k) != v for k, v in new.items())
              prev_checked = parse_date(prev.get('checked','')) or datetime.date(2000,1,1)
              out = {'lots': final,
                     'changed': TODAY.isoformat() if changed else prev.get('changed', TODAY.isoformat()),
                     'checked': TODAY.isoformat() if (changed or (TODAY - prev_checked).days >= 5) else prev.get('checked', TODAY.isoformat()),
                     'source': '+'.join(used)}
              if out != prev:
                  json.dump(out, open(OUT, 'w', encoding='utf-8'), indent=1); print('WROTE', OUT, out)
              else: print('No change.', out)

          if __name__ == '__main__': main()
          PYEOF
          python3 /tmp/update_lots.py
      - name: Save lots.json if it changed
        run: |
          if [ -n "$(git status --porcelain lots.json)" ]; then
            git config user.name "scalein-lots-bot"
            git config user.email "actions@users.noreply.github.com"
            git add lots.json
            git commit -m "lot sizes updated"
            git push
          else
            echo "lots.json unchanged"
          fi
